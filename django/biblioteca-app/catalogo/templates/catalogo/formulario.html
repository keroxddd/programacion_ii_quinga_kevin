<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{%if form.instance.pk%}Editar categoria{% else %}Crear categoria{%endif%} </title>
</head>
<body>
    <nav><a href="{% url 'home' %}">Inicio</a></nav>
    <h1>Biblioteca</h1>
    <h2>{%if form.instance.pk%}Editar categoria{% else %}Crear categoria{%endif%}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <p>
            <button type="submit">
                Guardar categoría
            </button>
            <a href="{% url 'categoria_list' %}">
                Cancelar
            </a>
        </p>
    </form>
</body>
</html>
