<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
</head>
<body>
    <main>
        <h1>Biblioteca</h1>
        <p>Sesión iniciada como <strong>{{ request.user.get_username }}</strong>.</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Cerrar sesión</button>
        </form>
        <p>Selecciona el catálogo que deseas consultar:</p>
        <nav>
            <ul>
                <li><a href="{% url 'libro_list' %}">Catálogo de libros</a></li>
                <li><a href="{% url 'categoria_list' %}">Catálogo de categorías</a></li>
            </ul>
        </nav>
    </main>
</body>
</html>
